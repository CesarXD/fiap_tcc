<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #1f2937; }
      .heading { font: 700 22px Arial, sans-serif; fill: #111827; }
      .body { font: 18px Arial, sans-serif; fill: #374151; }
      .center { font: 700 24px Arial, sans-serif; fill: #111827; }
      .box { fill: #ffffff; stroke: #4b5563; stroke-width: 2; rx: 18; ry: 18; }
      .line { stroke: #6b7280; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1400" height="980" fill="#f8fafc"/>
  <text x="700" y="55" text-anchor="middle" class="title">Mapa de Empatia — Usuário de Plano de Saúde</text>

  <line x1="700" y1="410" x2="700" y2="275" class="line"/>
  <line x1="565" y1="470" x2="410" y2="470" class="line"/>
  <line x1="835" y1="470" x2="990" y2="470" class="line"/>
  <line x1="700" y1="545" x2="700" y2="655" class="line"/>
  <line x1="625" y1="535" x2="430" y2="750" class="line"/>
  <line x1="775" y1="535" x2="970" y2="750" class="line"/>

  <circle cx="700" cy="470" r="115" fill="#e5e7eb" stroke="#4b5563" stroke-width="3"/>
  <circle cx="700" cy="425" r="28" fill="#9ca3af"/>
  <path d="M650 505 Q700 455 750 505 L750 540 L650 540 Z" fill="#9ca3af"/>
  <text x="700" y="585" text-anchor="middle" class="center">Usuário</text>

  <rect x="430" y="95" width="540" height="180" class="box"/>
  <text x="700" y="135" text-anchor="middle" class="heading">Pensa e sente</text>
  <text x="465" y="175" class="body">
    <tspan x="465" dy="0">• Quer cuidar melhor da saúde, mas tem dificuldade de manter rotina.</tspan>
    <tspan x="465" dy="30">• Valoriza praticidade, autonomia e economia de tempo.</tspan>
    <tspan x="465" dy="30">• Percebe pouco valor no aplicativo fora de necessidades pontuais.</tspan>
  </text>

  <rect x="55" y="335" width="355" height="270" class="box"/>
  <text x="232" y="375" text-anchor="middle" class="heading">Vê</text>
  <text x="85" y="420" class="body">
    <tspan x="85" dy="0">• Aplicativos de saúde e bem-estar.</tspan>
    <tspan x="85" dy="32">• Smartwatches e dispositivos de monitoramento.</tspan>
    <tspan x="85" dy="32">• Conteúdos sobre prevenção e qualidade de vida.</tspan>
    <tspan x="85" dy="32">• Diferentes informações distribuídas em vários apps.</tspan>
  </text>

  <rect x="990" y="335" width="355" height="270" class="box"/>
  <text x="1167" y="375" text-anchor="middle" class="heading">Ouve</text>
  <text x="1020" y="420" class="body">
    <tspan x="1020" dy="0">• Recomendações de médicos.</tspan>
    <tspan x="1020" dy="32">• Conteúdos de profissionais e influenciadores.</tspan>
    <tspan x="1020" dy="32">• Incentivos de empresas à qualidade de vida.</tspan>
    <tspan x="1020" dy="32">• Experiências de amigos com apps de saúde.</tspan>
  </text>

  <rect x="430" y="655" width="540" height="175" class="box"/>
  <text x="700" y="695" text-anchor="middle" class="heading">Fala e faz</text>
  <text x="465" y="735" class="body">
    <tspan x="465" dy="0">• Usa o aplicativo do plano apenas quando precisa.</tspan>
    <tspan x="465" dy="30">• Consulta médicos, exames, autorizações e carteirinha.</tspan>
    <tspan x="465" dy="30">• Utiliza outros aplicativos para atividade física ou alimentação.</tspan>
  </text>

  <rect x="55" y="700" width="355" height="220" class="box"/>
  <text x="232" y="740" text-anchor="middle" class="heading">Dores</text>
  <text x="85" y="785" class="body">
    <tspan x="85" dy="0">• Pouco valor no dia a dia.</tspan>
    <tspan x="85" dy="32">• Falta de incentivo ao uso recorrente.</tspan>
    <tspan x="85" dy="32">• Informações dispersas.</tspan>
    <tspan x="85" dy="32">• Experiência predominantemente reativa.</tspan>
  </text>

  <rect x="990" y="700" width="355" height="220" class="box"/>
  <text x="1167" y="740" text-anchor="middle" class="heading">Ganhos</text>
  <text x="1020" y="785" class="body">
    <tspan x="1020" dy="0">• Acompanhamento contínuo.</tspan>
    <tspan x="1020" dy="32">• Recomendações personalizadas.</tspan>
    <tspan x="1020" dy="32">• Incentivos e recompensas.</tspan>
    <tspan x="1020" dy="32">• Mais praticidade e autonomia.</tspan>
  </text>
</svg>
